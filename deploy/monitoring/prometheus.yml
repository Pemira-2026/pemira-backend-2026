global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    deployment: pemira-2026

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: pemira-api
    metrics_path: /metrics
    scheme: http
    authorization:
      # Create this file on the monitoring host; it must match METRICS_TOKEN.
      credentials_file: /etc/prometheus/pemira_metrics_token
    static_configs:
      - targets: ["api:8080"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
