# ==============================================================================
# PEMIRA 2026 - PRODUCTION STACK (single-host reference)
# ==============================================================================
# Usage (from the deploy/ directory):
#   cp ../.env.production.example .env.production   # fill it
#   docker compose -f docker-compose.production.yml --env-file .env.production up -d --build
#
# Placeholders:
#   PEMIRA_DOMAIN      voter site domain, e.g. pemira.example.ac.id
#   ADMIN_DOMAIN       admin console domain, e.g. admin.pemira.example.ac.id
#   API_DOMAIN         API domain, e.g. api.pemira.example.ac.id
#   TLS_CERT_PATH / TLS_KEY_PATH  host paths to fullchain.pem / privkey.pem
# ==============================================================================

# Deterministic container names so backup/restore scripts and runbooks can
# reference pemira_postgres / pemira_redis without guessing the project prefix.
name: pemira

services:
  postgres:
    image: postgres:16-alpine
    container_name: pemira_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pemira_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-pemira_db}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backups:/backups
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pemira_app} -d ${POSTGRES_DB:-pemira_db}"]
      interval: 10s
      timeout: 5s
      retries: 10
    # Never publish 5432 publicly. Backups run via docker exec from deploy/scripts.

  redis:
    image: redis:7-alpine
    container_name: pemira_redis
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --requirepass
      - ${REDIS_PASSWORD:?set REDIS_PASSWORD}
      - --maxmemory
      - 512mb
      - --maxmemory-policy
      - allkeys-lru
    volumes:
      - redisdata:/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: pemira_api
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      # Container-internal service names override the template hosts.
      # sslmode=disable is acceptable only on the private Docker bridge network.
      # For managed databases outside this host, set DATABASE_URL in .env.production
      # with sslmode=verify-full and remove this override.
      DATABASE_URL: postgresql://${POSTGRES_USER:-pemira_app}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-pemira_db}?sslmode=disable
      DB_HOST: postgres
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      SERVER_ENV: production
      # nginx runs in a sibling container, so trust the Docker bridge range.
      # If your Docker network uses a different subnet, narrow this value.
      TRUSTED_PROXIES: 172.16.0.0/12
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - internal
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 5
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  nginx:
    image: nginx:1.27-alpine
    container_name: pemira_nginx
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/pemira.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/snippets:/etc/nginx/snippets:ro
      - ${TLS_CERT_PATH:?set TLS_CERT_PATH}:/etc/nginx/tls/fullchain.pem:ro
      - ${TLS_KEY_PATH:?set TLS_KEY_PATH}:/etc/nginx/tls/privkey.pem:ro
      - ${FRONTEND_DIST_PATH:?set FRONTEND_DIST_PATH}:/usr/share/nginx/html/voter:ro
      - ${ADMIN_DIST_PATH:?set ADMIN_DIST_PATH}:/usr/share/nginx/html/admin:ro
    networks:
      - internal
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  # Optional monitoring profile:
  #   docker compose -f docker-compose.production.yml --profile monitoring up -d
  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: pemira_prometheus
    profiles: ["monitoring"]
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=30d
    volumes:
      # Whole dir so a missing token file fails loudly instead of becoming a
      # directory (a single-file bind mount would be auto-created as a dir).
      - ./monitoring:/etc/prometheus:ro
      - promdata:/prometheus
    networks:
      - internal
    expose:
      - "9090"

networks:
  internal:
    driver: bridge

volumes:
  pgdata:
  redisdata:
  promdata:
