# ==============================================================================
# PEMIRA 2026 - NGINX PRODUCTION REVERSE PROXY + STATIC FRONTENDS
# ==============================================================================
# Replace every *.pemira.example.ac.id with the real UPT TIK domain before use.
# TLS certs are mounted at /etc/nginx/tls/{fullchain,privkey}.pem by compose.
# ==============================================================================

# --- Rate limiting at the edge (defense in depth; app also rate-limits) ------
# Zone names are referenced by pemira.conf; keep them in sync.
limit_req_zone $binary_remote_addr zone=general:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=vote:10m rate=3r/s;
limit_conn_zone $binary_remote_addr zone=perip:10m;

# --- HTTP -> HTTPS -----------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name pemira.example.ac.id admin.pemira.example.ac.id api.pemira.example.ac.id;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# --- Voter frontend ----------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name pemira.example.ac.id;

    ssl_certificate     /etc/nginx/tls/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/privkey.pem;

    include /etc/nginx/snippets/tls-hardening.conf;
    include /etc/nginx/snippets/security-headers.conf;

    # Strict CSP for the voter SPA. Add external image/CDN hosts if used.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://challenges.cloudflare.com; frame-src https://challenges.cloudflare.com; connect-src 'self' https://api.pemira.example.ac.id https://challenges.cloudflare.com; img-src 'self' data: https:; style-src 'self' 'unsafe-inline'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'; object-src 'none'" always;

    limit_conn perip 50;

    root /usr/share/nginx/html/voter;
    index index.html;

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        # Re-declare: any add_header in a location drops the inherited set.
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

# --- Admin console -----------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name admin.pemira.example.ac.id;

    ssl_certificate     /etc/nginx/tls/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/privkey.pem;

    include /etc/nginx/snippets/tls-hardening.conf;
    include /etc/nginx/snippets/security-headers.conf;

    add_header Content-Security-Policy "default-src 'self'; connect-src 'self' https://api.pemira.example.ac.id; img-src 'self' data:; style-src 'self' 'unsafe-inline'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'; object-src 'none'" always;

    # Admin console: restrict to campus/VPN ranges where possible.
    # allow 10.0.0.0/8;
    # allow 103.x.x.0/24;
    # deny all;

    limit_conn perip 20;

    root /usr/share/nginx/html/admin;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
}

# --- API ---------------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name api.pemira.example.ac.id;

    ssl_certificate     /etc/nginx/tls/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/privkey.pem;

    include /etc/nginx/snippets/tls-hardening.conf;
    include /etc/nginx/snippets/security-headers.conf;

    client_max_body_size 64k;
    limit_conn perip 30;

    location = /health {
        proxy_pass http://api:8080/health;
        access_log off;
    }

    location /metrics {
        # Never expose metrics publicly. Only allow the monitoring network/VPN.
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        deny all;
        proxy_pass http://api:8080/metrics;
    }

    location /api/v1/auth/ {
        limit_req zone=auth burst=10 nodelay;
        proxy_pass http://api:8080;
        include /etc/nginx/snippets/proxy-params.conf;
    }

    location /api/v1/vote/ {
        limit_req zone=vote burst=10 nodelay;
        proxy_pass http://api:8080;
        include /etc/nginx/snippets/proxy-params.conf;
    }

    location / {
        limit_req zone=general burst=40 nodelay;
        proxy_pass http://api:8080;
        include /etc/nginx/snippets/proxy-params.conf;
    }
}
